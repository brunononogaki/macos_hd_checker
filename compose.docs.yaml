services:
  hdchecker-docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    container_name: hdchecker-docs
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=my-network"
      # HTTPS
      - "traefik.http.routers.hdchecker.rule=Host(`hdchecker.brunononogaki.com`)"
      - "traefik.http.routers.hdchecker.entrypoints=websecure"
      - "traefik.http.routers.hdchecker.tls=true"
      - "traefik.http.routers.hdchecker.tls.certresolver=letsencrypt"
      - "traefik.http.services.hdchecker.loadbalancer.server.port=80"
      # HTTP -> HTTPS
      - "traefik.http.routers.hdchecker-http.rule=Host(`hdchecker.brunononogaki.com`)"
      - "traefik.http.routers.hdchecker-http.entrypoints=web"
      - "traefik.http.routers.hdchecker-http.middlewares=hdchecker-redirect"
      - "traefik.http.middlewares.hdchecker-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.hdchecker-redirect.redirectscheme.permanent=true"
    networks:
      - my-network

networks:
  my-network:
    external: true
