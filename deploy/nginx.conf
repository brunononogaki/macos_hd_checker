server {
    listen 80;
    server_name _;               # troque pelo seu domínio ao usar fora do Docker
    root /usr/share/nginx/html;  # na VPS: /var/www/hdchecker
    index index.html;
    error_page 404 /404.html;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|jpg|svg|woff2?)$ { expires 30d; add_header Cache-Control "public"; }
}
