<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HD Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="logo">◉</span> HD Checker</div>
    <nav id="nav">
      <button data-tab="discos" class="active">Discos</button>
      <button data-tab="jobs">Jobs</button>
      <button data-tab="relatorios">Relatórios <span id="badge" class="badge hidden"></span></button>
      <button data-tab="ferramentas">Ferramentas</button>
      <button data-tab="config">Configurações</button>
    </nav>
    <div class="side-foot"><span id="appVersion"></span></div>
  </aside>
  <main class="main">
    <div id="banner" class="banner hidden"></div>
    <div id="view"></div>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
